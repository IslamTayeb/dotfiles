model = "gpt-5.5"
model_reasoning_effort = "xhigh"
plan_mode_reasoning_effort = "xhigh"
personality = "pragmatic"
approval_policy = "never"
sandbox_mode = "danger-full-access"
cli_auth_credentials_store = "file"

[features]
memories = true

[memories]
generate_memories = true
use_memories = true

[projects."/work"]
trust_level = "trusted"

[projects."/work/projects"]
trust_level = "trusted"

[projects."/work/projects/Mapperatorinator"]
trust_level = "trusted"

[projects."/work/projects/alembic-dev"]
trust_level = "trusted"

[projects."/work/projects/typhon"]
trust_level = "trusted"

[projects."/work/projects/llm-clang"]
trust_level = "trusted"

[projects."/work/projects/personal-website"]
trust_level = "trusted"

[projects."/work/projects/obsidian-vault"]
trust_level = "trusted"

[projects."/work/projects/resume"]
trust_level = "trusted"

[plugins."github@openai-curated"]
enabled = true

[plugins."google-drive@openai-curated"]
enabled = true

[plugins."frontend-design@claude-plugins-official"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true

[plugins."latex@openai-bundled"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = false

[plugins."chrome@openai-bundled"]
enabled = false

[plugins."computer-use@openai-bundled"]
enabled = false

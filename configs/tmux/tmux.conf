set-option -sa terminal-overrides ",xterm*:Tc"

# OSC 52 clipboard passthrough — only when SSH'd in, so local tmux on the main macbook stays default.
# Uses separate if-shell lines to keep terminfo escape sequences (\E, \7) from getting double-parsed.
if-shell 'test -n "$SSH_CLIENT"' 'set -g set-clipboard on'
if-shell 'test -n "$SSH_CLIENT"' 'set -g allow-passthrough on'
if-shell 'test -n "$SSH_CLIENT"' "set -ag terminal-overrides ',*:Ms=\\E]52;c;%p2%s\\7'"

# Use C-l locally, C-b when SSH'd
if-shell 'test -n "$SSH_CLIENT"' \
  'set -g prefix C-b; unbind C-l; bind C-b send-prefix' \
  'set -g prefix C-l; unbind C-b; bind C-l send-prefix'

# Set plugin path before loading plugins
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'

unbind C-i
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Kanagawa Dragon theme (hand-written, no plugin).
# Must be set BEFORE `run tpm` so continuum can prepend its autosave hook to status-right.
set -g status-style "bg=#282727,fg=#c5c9c5"
set -g status-left-length 40
set -g status-right-length 100
set -g status-left "#[bg=#8ba4b0,fg=#181616,bold] #S #[default] "
set -g status-right "#{?client_prefix,#[bg=#c4746e#,fg=#181616#,bold] PREFIX #[default] ,}#[bg=#393836,fg=#c5c9c5] %Y-%m-%d #[bg=#625e5a,fg=#c5c9c5] %H:%M #[bg=#8ba4b0,fg=#181616,bold] #h "
set -g window-status-format "#[fg=#a6a69c] #I:#W "
set -g window-status-current-format "#[bg=#393836,fg=#c5c9c5,bold] #I:#W "
set -g window-status-separator ""
set -g pane-border-style "fg=#393836"
set -g pane-active-border-style "fg=#8ba4b0"
set -g message-style "bg=#393836,fg=#c5c9c5"
set -g message-command-style "bg=#393836,fg=#c5c9c5"
set -g mode-style "bg=#2d4f67,fg=#c5c9c5"
set -g clock-mode-colour "#8ba4b0"

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Vim‑style pane navigation (prefix + h/j/k/l)
bind h select-pane -L   # left
bind j select-pane -D   # down
bind k select-pane -U   # up
bind l select-pane -R   # right

set -g status on

set -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

set -g renumber-windows on

set -g @continuum-save-interval '5'  # optional, change interval
set -g @continuum-boot 'off'
set -g @continuum-restore 'on'

# Set explicit resurrect directory to ensure it works in SSH
set -g @resurrect-dir '~/.tmux/resurrect'
set -g @resurrect-capture-pane-contents 'on'  # optional feature
set -g display-time 2000  # show messages for 2 seconds

# Start window numbers at 1
set -g base-index 1

# Start pane numbers at 1
set -g pane-base-index 1

run '~/.tmux/plugins/tpm/tpm'

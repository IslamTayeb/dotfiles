set -g default-terminal "tmux-256color"
# Truecolor + synchronized output (stops redraw flicker). tmux* covers the
# remote tmux running inside this local one, which previously fell back to 256 colors.
set -as terminal-features ",xterm*:RGB:sync,tmux*:RGB:sync"

# OSC 52 clipboard passthrough — only when SSH'd in, so local tmux on the main macbook stays default.
# Uses separate if-shell lines to keep terminfo escape sequences (\E, \7) from getting double-parsed.
if-shell 'test -n "$SSH_CLIENT"' 'set -g set-clipboard on'
if-shell 'test -n "$SSH_CLIENT"' 'set -g allow-passthrough on'
if-shell 'test -n "$SSH_CLIENT"' "set -ag terminal-overrides ',*:Ms=\\E]52;c;%p2%s\\7'"

# Use C-l locally, C-b when SSH'd
if-shell 'test -n "$SSH_CLIENT"' \
  'set -g prefix C-b; unbind C-l; bind C-b send-prefix' \
  'set -g prefix C-l; unbind C-b; bind C-l send-prefix'

# Set plugin path before loading plugins
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'

unbind C-i
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Kanagawa Dragon theme (hand-written; same powerline layout as egel/tmux-gruvbox dark).
# Must be set BEFORE `run tpm` so continuum can prepend its autosave hook to status-right.
# Palette: bg1=#282727 bg2=#393836 bg3=#625e5a fg1=#c5c9c5 fg3=#a6a69c fg4=#9e9b93 accent=#8ba4b0
# The arrow glyphs are Powerline private-use chars U+E0B0..U+E0B3 (need a Nerd/Powerline font).
set -g status on
set -g status-style "bg=#282727,fg=#c5c9c5"
set -g status-justify left
set -g status-left-style none
set -g status-left-length 80
set -g status-right-style none
set -g status-right-length 80
setw -g window-status-separator ""
setw -g window-status-style "bg=#8ba4b0,fg=#282727"
setw -g window-status-activity-style "bg=#282727,fg=#a6a69c"
setw -g window-status-current-style "bg=#8ba4b0,fg=#282727"
setw -g window-status-bell-style "bg=#c4746e,fg=#181616"
set -g pane-active-border-style "fg=#c5c9c5"
set -g pane-border-style "fg=#282727"
# tmux 3.6+ draws prompts on top of the status bar; without fill= the bar shows through.
set -g message-style "bg=#393836,fg=#c5c9c5,fill=#393836"
set -g message-command-style "bg=#a6a69c,fg=#282727,fill=#a6a69c"
set -g display-panes-active-colour "#c5c9c5"
set -g display-panes-colour "#282727"
setw -g clock-mode-colour "#8ba4b0"

set -g status-left "#[bg=#625e5a,fg=#c5c9c5] #S #[bg=#282727,fg=#625e5a,nobold,noitalics,nounderscore]"
set -g status-right "#[bg=#282727,fg=#393836,nobold,nounderscore,noitalics]#[bg=#393836,fg=#9e9b93] #{?client_prefix,#[bold]PREFIX #[nobold],} %Y-%m-%d  %H:%M #[bg=#393836,fg=#a6a69c,nobold,noitalics,nounderscore]#[bg=#a6a69c,fg=#282727] #h "
setw -g window-status-current-format "#[bg=#8ba4b0,fg=#282727,nobold,noitalics,nounderscore]#[bg=#8ba4b0,fg=#181616] #I #[fg=#181616]#[fg=#181616,bold] #W#{?window_zoomed_flag,*Z,} #[bg=#282727,fg=#8ba4b0,nobold,noitalics,nounderscore]"
setw -g window-status-format "#[bg=#393836,fg=#282727,noitalics]#[bg=#393836,fg=#c5c9c5] #I #[fg=#a6a69c]#[fg=#c5c9c5] #W #[bg=#282727,fg=#393836,noitalics]"

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Vim‑style pane navigation (prefix + h/j/k/l)
bind h select-pane -L   # left
bind j select-pane -D   # down
bind k select-pane -U   # up
bind l select-pane -R   # right

set -g status on

set -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

set -g renumber-windows on

set -g @continuum-save-interval '5'  # optional, change interval
set -g @continuum-boot 'off'
set -g @continuum-restore 'on'

# Set explicit resurrect directory to ensure it works in SSH
set -g @resurrect-dir '~/.tmux/resurrect'
set -g @resurrect-capture-pane-contents 'on'  # optional feature
set -g display-time 2000  # show messages for 2 seconds

# Start window numbers at 1
set -g base-index 1

# Start pane numbers at 1
set -g pane-base-index 1

run '~/.tmux/plugins/tpm/tpm'
